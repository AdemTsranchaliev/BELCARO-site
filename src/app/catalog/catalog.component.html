<div class="tf-page-title">
    <div class="container-full">
        <div class="heading text-center">{{category}}</div>
        <p class="text-center text-2 text_black-2 mt_5">Разгледайте нашата последна колекция мебели и открийте вдъхновение за интериорен стил!</p>
    </div>
</div>
<!-- /page-title -->

<!-- Section Product -->
<section class="flat-spacing-2">
    <div class="container">
        <div class="tf-shop-control grid-3 align-items-center">
            <div class="tf-control-filter"></div>
            <ul class="tf-control-layout d-flex justify-content-center">
                <li class="tf-view-layout-switch sw-layout-list list-layout" data-value-layout="list">
                    <div class="item"><span class="icon icon-list"></span></div>
                </li>
                <li class="tf-view-layout-switch sw-layout-2" data-value-layout="tf-col-2">
                    <div class="item"><span class="icon icon-grid-2"></span></div>
                </li>
                <li class="tf-view-layout-switch sw-layout-3" data-value-layout="tf-col-3">
                    <div class="item"><span class="icon icon-grid-3"></span></div>
                </li>
                <li class="tf-view-layout-switch sw-layout-4 active" data-value-layout="tf-col-4">
                    <div class="item"><span class="icon icon-grid-4"></span></div>
                </li>
                <li class="tf-view-layout-switch sw-layout-5" data-value-layout="tf-col-5">
                    <div class="item"><span class="icon icon-grid-5"></span></div>
                </li>
                <li class="tf-view-layout-switch sw-layout-6" data-value-layout="tf-col-6">
                    <div class="item"><span class="icon icon-grid-6"></span></div>
                </li>
            </ul>
        </div>
        
        <div class="wrapper-control-shop">
            <div class="meta-filter-shop">
                <div id="product-count-grid" class="count-text"></div>
                <div id="product-count-list" class="count-text"></div>
                <div id="applied-filters"></div>
                <button id="remove-all" class="remove-all-filters" style="display: none;">Remove All <i class="icon icon-close"></i></button>
            </div>
            <!-- list layout -->
            <div class="tf-list-layout wrapper-shop" id="listLayout">
                <div class="card-product list-layout"  data-availability="In stock" data-brand="Ecomus" *ngFor="let product of paginatedProducts">
                    <div class="card-product-wrapper" style="aspect-ratio: 0;">
                        <a href="#" class="product-img">
                            <img class="lazyload img-product"
                                data-src="assets/images/products-thumb/{{ product.Image.toLowerCase() }}.1.jpg"
                                src="assets/images/products-thumb/{{ product.Image.toLowerCase() }}.1.jpg" alt="image-product">
                            <img class="lazyload img-hover" data-src="assets/images/products-thumb/{{ product.Image.toLowerCase() }}.1.jpg"
                                src="assets/images/products-thumb/{{ product.Image.toLowerCase() }}.1.jpg" alt="image-product">
                        </a>
                    </div>
                    <div class="card-product-info">
                        <a routerLink="/details/{{product.Id}}" class="title link">{{ product.Name }}</a>
                        <p class="description">{{product.Description}}</p>
                        <div class="list-product-btn">
                            <a href="#" class="box-icon wishlist style-3 hover-tooltip"><span class="icon icon-heart"></span> <span class="tooltip">Add to Wishlist</span></a>
                            <a routerLink="/details/{{product.Id}}" data-bs-toggle="modal" class="box-icon quickview style-3 hover-tooltip">
                                <span class="icon icon-view"></span><span class="tooltip">Quick view</span>
                            </a>
                        </div>
                    </div>
                </div>
                <!-- pagination -->
                <ul class="wg-pagination tf-pagination-list justify-content-start">
                    <li class="active">
                        <a href="javascript:void(0)" class="pagination-link">1</a>
                    </li>
                    <li>
                        <a href="javascript:void(0)" class="pagination-link animate-hover-btn">
                            <span class="icon icon-arrow-right"></span>
                        </a>
                    </li>
                </ul>
            </div>

            <!-- grid layout -->
            <div class="tf-grid-layout wrapper-shop tf-col-4" id="gridLayout">
                <div class="card-product grid" data-availability="In stock" data-brand="Ecomus" *ngFor="let product of paginatedProducts">
                    <div class="card-product-wrapper" style="aspect-ratio: 0;">
                        <a routerLink="/details/{{product.Id}}" class="product-img">
                            <img class="lazyload img-product"
                                data-src="assets/images/products-thumb/{{ product.Image.toLowerCase() }}.1.jpg"
                                src="assets/images/products-thumb/{{ product.Image.toLowerCase() }}.1.jpg" alt="image-product">
                            <img class="lazyload img-hover" data-src="assets/images/products-thumb/{{ product.Image.toLowerCase() }}.1.jpg"
                                src="assets/images/products-thumb/{{ product.Image.toLowerCase() }}.1.jpg" alt="image-product">
                        </a>
                        <div class="list-product-btn absolute-2">
                            <a href="javascript:void(0);" class="box-icon bg_white wishlist btn-icon-action">
                                <span class="icon icon-heart"></span>
                                <span class="tooltip">Add to Wishlist</span>
                                <span class="icon icon-delete"></span>
                            </a>
                            <a routerLink="/details/{{product.Id}}" data-bs-toggle="modal" class="box-icon bg_white quickview tf-btn-loading">
                                <span class="icon icon-view"></span>
                                <span class="tooltip">Quick View</span>
                            </a>
                        </div>
                    </div>
                    <div class="card-product-info">
                        <a routerLink="/details/{{product.Id}}" class="title link">{{ product.Name }}</a>
                    </div>
                </div>
            </div>
            <ul class="tf-pagination-wrap tf-pagination-list">
                <!-- Previous Button -->
                <li [class.disabled]="currentPage === 1" (click)="prevPage()">
                    <a href="javascript:void(0)" class="pagination-link">
                        <span class="icon icon-arrow-left"></span>
                    </a>
                </li>
            
                <!-- Page Numbers -->
                <li *ngFor="let page of [].constructor(totalPages); let i = index" [class.active]="i + 1 === currentPage">
                    <a href="javascript:void(0)" class="pagination-link" (click)="currentPage = i + 1">{{ i + 1 }}</a>
                </li>
            
                <!-- Next Button -->
                <li [class.disabled]="currentPage === totalPages" (click)="nextPage()">
                    <a href="javascript:void(0)" class="pagination-link">
                        <span class="icon icon-arrow-right"></span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</section>
<!-- /Section Product -->

<!-- Filter -->
<div class="offcanvas offcanvas-start canvas-filter" id="filterShop">
    <div class="canvas-wrapper">
        <header class="canvas-header">
            <div class="filter-icon">
                <span class="icon icon-filter"></span>
                <span>Filter</span>
            </div>
            <span class="icon-close icon-close-popup" data-bs-dismiss="offcanvas" aria-label="Close"></span>
        </header>
        <div class="canvas-body">
            <form action="#" id="facet-filter-form" class="facet-filter-form">
                <div class="widget-facet">
                    <div class="facet-title" data-bs-target="#price" data-bs-toggle="collapse" aria-expanded="true" aria-controls="price">
                        <span>Price</span>
                        <span class="icon icon-arrow-up"></span>
                    </div>
                    <div id="price" class="collapse show">
                        <div class="widget-price filter-price">
                            <div class="price-val-range" id="price-value-range" data-min="0" data-max="500"></div>
                            <div class="box-title-price">
                                <span class="title-price">Price :</span>
                                <div class="caption-price">
                                    <div class="price-val" id="price-min-value" data-currency="$"></div>
                                    <span>-</span>
                                    <div class="price-val" id="price-max-value" data-currency="$"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<!-- End Filter -->
