<!-- Luxury Catalog Header -->
<div class="luxury-catalog-header">
    <div class="container">
        <h1 class="category-title">{{category}}</h1>
        <p class="category-description">Разгледайте нашата последна колекция мебели и открийте вдъхновение за интериорен стил!</p>
    </div>
</div>

<!-- Catalog Section -->
<section class="luxury-catalog">
    <div class="container">
        <!-- Filters and Controls -->
        <div class="catalog-header">
            <div class="filters-toggle" (click)="toggleFilters()">
                <i class="fas fa-filter"></i>
                <span>Филтри</span>
            </div>

            <div class="view-controls">
                <button [class.active]="viewMode === 'grid'" (click)="setViewMode('grid')" title="Grid View">
                    <i class="fas fa-th-large"></i>
                </button>
                <button [class.active]="viewMode === 'list'" (click)="setViewMode('list')" title="List View">
                    <i class="fas fa-list"></i>
                </button>
            </div>
        </div>

        <div class="catalog-content">
            <!-- Filters sidebar -->
            <div class="filters-sidebar" [class.active]="showFilters">
                <div class="filters-header">
                    <h3>Филтри</h3>
                    <button class="close-filters" (click)="toggleFilters()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <div class="filters-content">
                    <!-- Price Range -->


                    <!-- Categories -->
                    <div class="filter-group">
                        <h4>Категории</h4>
                        <div class="category-filters">
                            <label *ngFor="let cat of categories">
                                <input type="checkbox" 
                                       [checked]="isFilterActive(cat)"
                                       (change)="toggleCategoryFilter(cat)">
                                {{cat}}
                            </label>
                        </div>
                    </div>
                </div>

                <div class="filters-footer">
                    <button class="apply-filters" (click)="applyFilters()">Приложи</button>
                    <button class="clear-filters" (click)="clearFilters()">Изчисти</button>
                </div>
            </div>

            <!-- Products grid -->
            <div class="products-wrapper" [class.list-view]="viewMode === 'list'">
                <div class="product-card" *ngFor="let product of paginatedProducts" [class.list-mode]="viewMode === 'list'">
                    <div class="product-image">
                        <a [routerLink]="['/details', product.Id]">
                            <img [src]="'assets/images/products-thumb/' + product.Image.toLowerCase() + '.1.webp'" 
                                 [alt]="product.Name"
                                 loading="lazy">
                        </a>
                        <div class="product-actions">
                            <button class="action-btn" (click)="quickView(product)" title="Бърз преглед">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="action-btn" [class.active]="isInWishlist(product)" (click)="addToFavorites(product)" title="Добави в любими">
                                <i class="fas fa-heart"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="product-info">
                        <h3 class="product-title">
                            <a [routerLink]="['/details', product.Id]">{{product.Name}}</a>
                        </h3>
                        <p class="product-description" *ngIf="viewMode === 'list'">{{product.Description}}</p>
                    </div>
                </div>
            </div>

            <!-- Pagination -->
            <div class="pagination" *ngIf="totalPages > 1">
                <button class="page-btn" [disabled]="currentPage === 1" (click)="setPage(currentPage - 1)">
                    <i class="fas fa-chevron-left"></i>
                </button>
                
                <button class="page-btn" [class.active]="currentPage === 1" (click)="setPage(1)">1</button>
                
                <span class="ellipsis" *ngIf="currentPage > 3">...</span>
                
                <button class="page-btn" *ngFor="let page of [currentPage - 1, currentPage, currentPage + 1]"
                        [class.active]="page === currentPage"
                        (click)="setPage(page)"
                        [style.display]="page > 1 && page < totalPages ? 'block' : 'none'">
                    {{page}}
                </button>
                
                <span class="ellipsis" *ngIf="currentPage < totalPages - 2">...</span>
                
                <button class="page-btn" [class.active]="currentPage === totalPages" (click)="setPage(totalPages)"
                        *ngIf="totalPages > 1">
                    {{totalPages}}
                </button>
                
                <button class="page-btn" [disabled]="currentPage === totalPages" (click)="setPage(currentPage + 1)">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
</section>

<!-- Quick View Modal -->
<div class="quick-view-modal" *ngIf="selectedProduct" (click)="closeQuickView()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <button class="close-modal" (click)="closeQuickView()">
            <i class="fas fa-times"></i>
        </button>
        
        <div class="modal-body">
            <div class="product-gallery">
                <img [src]="'assets/images/products/' + selectedProduct.Image.toLowerCase() + '.1.webp'" 
                     [alt]="selectedProduct.Name">
            </div>
            
            <div class="product-details">
                <h2>{{selectedProduct.Name}}</h2>
                <p class="description">{{selectedProduct.Description}}</p>
                
                <div class="actions">
                    <a [routerLink]="['/details', selectedProduct.Id]" class="view-details">
                        Виж детайли
                    </a>
                    <button class="add-to-favorites" [class.active]="isInWishlist(selectedProduct)" (click)="addToFavorites(selectedProduct)">
                        <i class="fas fa-heart"></i>
                        {{isInWishlist(selectedProduct) ? 'Премахни от любими' : 'Добави в любими'}}
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
