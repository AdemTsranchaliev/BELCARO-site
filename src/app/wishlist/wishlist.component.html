<main class="wish-page">
    <header class="wish-page__head">
        <div class="container wish-page__head-row">
            <div>
                <p class="wish-page__kicker">Каталог</p>
                <h1 class="wish-page__title">Любими</h1>
                <p class="wish-page__lead" *ngIf="wishlistItems.length">{{ countLabel }}</p>
            </div>
            <button
                *ngIf="wishlistItems.length"
                type="button"
                class="wish-page__clear"
                (click)="clearWishlist()">
                Изчисти
            </button>
        </div>
    </header>

    <section class="wish-page__body">
        <div class="container">
            <div *ngIf="wishlistItems.length === 0" class="wish-page__empty">
                <p>Все още няма запазени модели.</p>
                <a routerLink="/catalog" class="wish-page__go">Към каталога</a>
            </div>

            <div class="wish-page__grid" *ngIf="wishlistItems.length">
                <article class="wish-page__piece" *ngFor="let product of wishlistItems; trackBy: trackById">
                    <a class="wish-page__media" [routerLink]="['/details', product.Id]">
                        <img
                            [src]="imageSrc(product, '640')"
                            [attr.srcset]="imageSrc(product, '640') + ' 640w, ' + imageSrc(product, '1000') + ' 1000w'"
                            sizes="(max-width: 767px) 100vw, (max-width: 1199px) 50vw, 33vw"
                            [alt]="product.Name"
                            loading="lazy"
                            decoding="async">
                    </a>
                    <p class="wish-page__cat" *ngIf="product.Category">{{ categoryLabel(product.Category) }}</p>
                    <h2 class="wish-page__name">
                        <a [routerLink]="['/details', product.Id]">{{ product.Name }}</a>
                    </h2>
                    <button type="button" class="wish-page__remove" (click)="removeFromWishlist(product)">
                        Премахни
                    </button>
                </article>
            </div>
        </div>
    </section>
</main>
